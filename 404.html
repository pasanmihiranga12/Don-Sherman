<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Don Sherman</title>
<meta name="robots" content="noindex">
<!-- this page gets served for any unmatched URL, at any depth
     (e.g. /restaurant.html/index.html#about) — without this, every
     relative link/asset below would resolve against that fake path
     instead of the real site root, breaking links and the logo image -->
<base href="/">
<link rel="icon" type="image/png" href="images/don-personal-logo.png">
<meta name="theme-color" content="#0a0a0a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --black:#0a0a0a;
  --gold:#c9a227;
  --gold-soft:#e4c968;
  --cream:#f2efe9;
  --line: rgba(242,239,233,0.14);
  --ease: cubic-bezier(.16,.84,.44,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--black);}
body{
  color:var(--cream);
  font-family:'Inter',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:32px 24px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
::selection{background:var(--gold);color:var(--black);}
a{color:inherit;text-decoration:none;}

.nf-logo{
  position:absolute;top:28px;left:50%;transform:translateX(-50%);
  height:40px;width:auto;
  opacity:.9;
}

.nf-glow{
  position:absolute;top:50%;left:50%;
  width:900px;height:900px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(201,162,39,0.14) 0%, rgba(201,162,39,0) 65%);
  pointer-events:none;
}

.nf-eyebrow{
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;
  color:var(--gold);
  display:flex;align-items:center;gap:10px;
  margin-bottom:22px;
  opacity:0;
  animation:nfUp .7s var(--ease) .1s forwards;
}
.nf-eyebrow::before,.nf-eyebrow::after{content:'';width:22px;height:1px;background:currentColor;opacity:.6;}

.nf-num{
  font-family:'Inter',sans-serif;
  font-style:normal;font-weight:900;
  font-size:clamp(90px,18vw,180px);
  line-height:.9;
  background:linear-gradient(180deg, var(--gold-soft), var(--gold) 60%, #7a5a15);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-0.02em;
  opacity:0;
  animation:nfUp .8s var(--ease) .2s forwards;
}

.nf-title{
  font-family:'Instrument Serif',serif;
  font-style:italic;font-weight:400;
  font-size:clamp(26px,4vw,40px);
  margin-top:10px;
  opacity:0;
  animation:nfUp .8s var(--ease) .32s forwards;
}
.nf-title em{
  font-style:italic;
  background:linear-gradient(100deg, #8a6416 0%, #c9a227 25%, #f6e3a8 50%, #c9a227 75%, #8a6416 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.nf-sub{
  max-width:460px;
  margin:16px auto 34px;
  font-size:15px;line-height:1.6;
  color:rgba(242,239,233,0.6);
  opacity:0;
  animation:nfUp .8s var(--ease) .44s forwards;
}

.nf-actions{
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
  opacity:0;
  animation:nfUp .8s var(--ease) .56s forwards;
}

.mag-btn{
  position:relative;display:inline-flex;align-items:center;gap:10px;
  padding:15px 28px;border:1px solid var(--gold);border-radius:40px;
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  color:var(--gold);overflow:hidden;transition:transform .3s var(--ease);
}
.mag-btn:hover{transform:translateY(-2px);}
.mag-btn .mb-bg{position:absolute;inset:0;background:var(--gold);transform:scale(0);border-radius:50%;transition:transform .5s var(--ease);z-index:0;}
.mag-btn:hover .mb-bg{transform:scale(1.6);}
.mag-btn span,.mag-btn svg{position:relative;z-index:1;transition:color .4s var(--ease);}
.mag-btn:hover span,.mag-btn:hover svg{color:var(--black);}
.mag-btn svg{width:13px;height:13px;transition:transform .4s var(--ease), color .4s var(--ease);}
.mag-btn:hover svg{transform:translate(3px,-3px);}
.mag-btn--solid{background:var(--gold);color:var(--black);box-shadow:0 10px 30px rgba(201,162,39,0.3);}
.mag-btn--solid .mb-bg{background:var(--black);}
.mag-btn--solid span,.mag-btn--solid svg{color:var(--black);}
.mag-btn--solid:hover span,.mag-btn--solid:hover svg{color:var(--gold);}

.nf-links{
  margin-top:40px;
  display:flex;gap:22px;flex-wrap:wrap;justify-content:center;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:rgba(242,239,233,0.4);
  opacity:0;
  animation:nfUp .8s var(--ease) .68s forwards;
}
.nf-links a:hover{color:var(--gold);}
.nf-links span{color:var(--line);}

@keyframes nfUp{ from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }

@media (max-width:480px){
  .nf-actions{flex-direction:column;width:100%;max-width:280px;}
  .mag-btn{justify-content:center;}
}
</style>
</head>
<body>

<div class="nf-glow"></div>

<a href="/"><img src="images/don-personal-logo.png" alt="Don Sherman" class="nf-logo"></a>

<div class="nf-eyebrow">Wrong Table</div>
<div class="nf-num">404</div>
<h1 class="nf-title">This page isn't <em>on the menu.</em></h1>
<p class="nf-sub">Whatever you were looking for has wandered off the stage — the link's broken, moved, or never existed. Let's get you back to where the show's actually happening.</p>

<div class="nf-actions">
  <a href="/" class="mag-btn mag-btn--solid"><span class="mb-bg"></span><span>Back to Home</span><svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <a href="/restaurant" class="mag-btn"><span class="mb-bg"></span><span>Visit the Restaurant</span><svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</div>

<div class="nf-links">
  <a href="/#about">About</a><span>·</span>
  <a href="/#gallery">Gallery</a><span>·</span>
  <a href="/booking">Book Don</a><span>·</span>
  <a href="/#contact">Contact</a>
</div>

</body>
</html>
